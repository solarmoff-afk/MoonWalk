[workspace]
resolver = "2"
members = [
    "dev/benchmark",
    "bootstrap",
    "examples/example",
    "examples/example-video",
    "examples/example3d",
    "examples/example-custom-paint",
    "examples/example-liquid-glass",
    "examples/example-liquid-mask",
    "examples/example-text",
    "moonwalk",
    "widget",
    "crates/lunar3d",
    "crates/backend",
    "crates/paint", "crates/moonwalk_mwsl", "examples/example-vector",
]

[profile.release]
lto = true
# target-cpu = "native"
debug = false
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
moonwalk = { path = "./moonwalk" }
lunar3d = { path = "./crates/lunar3d" }
moonwalk_bootstrap = { path = "./bootstrap" }
moonwalk_backend = { path = "./crates/backend" }
moonpaint = { path = "./crates/paint" }
